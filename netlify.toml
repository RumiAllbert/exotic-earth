[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"
